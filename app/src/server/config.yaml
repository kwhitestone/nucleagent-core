# 系统配置
system:
  env: 'local'
  addr: 26680

# JWT签名
jwt:
  signing-key: '${JWT_SECRET}'
  expires-time: '24h'
  buffer-time: '1h'
  issuer: 'nucleagent-core'

# 认证配置
auth:
  provider: 'builtin'

# 权限控制
rbac:
  provider: 'builtin'

# Zap日志配置
zap:
  level: 'info'
  prefix: '[NUCLEAGENT-CORE]'
  format: 'console'
  director: 'log'
  encode-level: 'LowercaseColorLevelEncoder'
  stacktrace-key: 'stacktrace'
  max-age: 0
  show-line: true
  log-in-console: true

# MySQL配置
mysql:
  host: '${DB_HOST}'
  port: '${DB_PORT}'
  db-name: '${DB_NAME}'
  username: '${DB_USER}'
  password: '${DB_PASSWORD}'
  config: 'charset=utf8mb4&parseTime=True&loc=Local'
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: 'error'
  log-zap: false

# 跨域配置
cors:
  mode: 'strict-whitelist'
  whitelist:
    - allow-origin: '${WEB_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true
    - allow-origin: '${AUTH_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true
    - allow-origin: '${CORE_FRONTEND_URL}'
      allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
      allow-headers: 'Content-Type,AccessToken,X-CSRF-Token,Authorization,Token,X-Token,X-User-Id,auth_token'
      expose-headers: 'Content-Length,Access-Control-Allow-Origin,Access-Control-Allow-Headers,Content-Type'
      allow-credentials: true

# Nucleagent 配置
nucleagent:
  executor-url: '${EXECUTOR_URL:-http://localhost:26690}'
  redis-addr: '${REDIS_ADDR:-localhost:6379}'
  executor-token: '${EXECUTOR_TOKEN}'   # S2S 校验 X-Executor-Token（与 executor 共享）
  public-url: '${NUCLEAGENT_PUBLIC_URL:-http://localhost:26680}'  # executor 回连 WS 用（不信任 Host 头）
  # storage 服务地址（附件元数据查询 + 下载链接签发；core 不经手文件字节）。
  # 留空则附件不可用，但普通对话照常工作 —— 降级而非全盘失败。
  storage-url: '${STORAGE_URL:-http://localhost:26610}'
  # providers.api_key 的 AES-GCM 主密钥（32 字节：64 位 hex 或 32 位原始）。
  # 无默认值：缺失时 main.go 启动即 fatal，绝不带病启动——
  # 历史教训是它曾只靠手动 export 存在，重启后静默丢失，直到用户发消息才失败。
  master-key: '${MASTER_KEY}'

